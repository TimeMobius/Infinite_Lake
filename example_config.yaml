# Lakehouse 配置示例

# 服务监听配置
server:
  port: 8080  # 监听端口号

# 数据湖存储路径配置
storage:
  data_lake_path: "/path/to/your/datalake/storage"  # 数据湖存储路径

# 数据库连接配置
database:
  # SQL 数据库连接信息
  sql:
    type: "mysql"  # 数据库类型，例如: postgresql, mysql, sqlite等
    host: "localhost"   # 数据库服务器地址
    port: 5432          # 数据库服务端口
    database: "lakehouse_db"  # 数据库名称
    user: "user"        # 数据库用户名
    password: "password"  # 数据库密码

  # Qdrant 数据库连接信息
  qdrant:
    host: "localhost"   # Qdrant服务地址
    port: 6333          # Qdrant服务端口
    collection: "your_collection_name"  # Qdrant集合名称

# 数据集导出配置
export:
  base_path: "/path/to/export/datasets"  # 数据集导出的主路径

# 文本向量化API服务配置
text_vectorization:
  api_url: "http://localhost:5000"  # 文本向量化服务的URL
  api_key: "your_api_key_here"  # 如有需要，提供API密钥
  truncation_length: 512  # 文本截断长度
